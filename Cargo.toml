[package]
name = "modplay-rs"
version = "0.1.0"
edition = "2021"
description = "Tracker music (MOD / IT / S3M / XM) playback engines and a player, in pure Rust"
license = "BSD-3-Clause"

[lib]
name = "modplay"
path = "src/lib.rs"

[[bin]]
name = "pt2wav"
path = "src/bin/pt2wav.rs"

[[bin]]
name = "modplay"
path = "src/bin/modplay/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:cpal", "dep:rfd"]
# link libopenmpt (C library) for the comparison tools in examples/ (itcmp, xmcmp, bench mpt);
# the player and the engines do not need it
openmpt = []

[[example]]
name = "itcmp"
required-features = ["openmpt"]

[[example]]
name = "xmcmp"
required-features = ["openmpt"]

[dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.14", optional = true, default-features = false }

[profile.release]
opt-level = 3
