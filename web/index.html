<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modplay — tracker music player (Rust / WebAssembly)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #15171c; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             color: #8a93a3; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="modplay"></canvas>
<div id="loading">Loading…</div>
<input id="file" type="file" accept=".mod,.it,.s3m,.xm" style="display:none">
<script type="module">
  import init, { start, load_module } from "./modplay_web.js";

  await init();
  document.getElementById("loading").remove();

  // the folder button in the player clicks this hidden input
  document.getElementById("file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (f) load_module(f.name, new Uint8Array(await f.arrayBuffer()));
    e.target.value = "";
  });

  // ?url=<module url> loads a module from the web (the server must allow CORS)
  const url = new URLSearchParams(location.search).get("url");
  if (url) {
    fetch(url)
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then((b) => load_module(decodeURIComponent(url.split("/").pop().split("?")[0]), new Uint8Array(b)))
      .catch((e) => console.error("could not fetch", url, e));
  }

  await start("modplay");
</script>
</body>
</html>
